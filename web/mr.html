<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF6 MR推移</title>
<style>
  :root { --bg:#fafafa; --fg:#222; --sub:#777; --card:#fff; --line:#e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16171a; --fg:#eee; --sub:#999; --card:#202226; --line:#33363c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 4px; }
  .sub { color:var(--sub); font-size:.85rem; margin-bottom:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .ranges button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:4px 12px; margin:0 4px 8px 0; cursor:pointer; }
  .ranges button.on { background:var(--fg); color:var(--bg); }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:.9rem; }
  td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:right; }
  td:first-child, th:first-child { text-align:left; }
  .up { color:#2a9d5c; } .down { color:#d0454c; }
</style>
</head>
<body>
<main>
  <h1>SF6 MR推移</h1>
  <div class="sub" id="updated">読み込み中…</div>
  <div class="ranges" id="ranges"></div>
  <div class="card"><canvas id="chart" height="320"></canvas></div>
  <table id="summary"></table>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
const RANGES = [["1週間",7],["1か月",30],["3か月",90],["全部",0]];
let data, chart, days = 30;
const colors = ["#e4572e","#4c8bf5","#2a9d5c","#f2a541","#9b5de5","#00b4d8"];

function render() {
  const since = days ? Date.now() - days*864e5 : 0;
  const ds = data.series.map((s,i) => ({
    label: s.label, borderColor: colors[i%colors.length], backgroundColor: colors[i%colors.length],
    pointRadius: 2, tension: .2,
    data: s.points.filter(p => new Date(p[0]) >= since).map(p => ({x:new Date(p[0]), y:p[1]}))
  }));
  if (chart) { chart.data.datasets = ds; chart.update(); return; }
  chart = new Chart(document.getElementById("chart"), {
    type: "line", data: { datasets: ds },
    options: { responsive:true, interaction:{mode:"nearest",intersect:false},
      scales: { x:{type:"time", time:{unit:"day", displayFormats:{day:"M/d"}}}, y:{title:{display:true,text:"MR"}} } }
  });
}
function summary() {
  const rows = data.series.map(s => {
    const p = s.points, last = p[p.length-1];
    const t = new Date(last[0]) - 7*864e5;
    const base = [...p].reverse().find(q => new Date(q[0]) <= t) || p[0];
    const d = last[1] - base[1];
    return `<tr><td>${s.label}</td><td>${last[1].toLocaleString()}</td><td class="${d>0?"up":d<0?"down":""}">${d>0?"+":""}${d}</td><td>${Math.max(...p.map(q=>q[1])).toLocaleString()}</td></tr>`;
  });
  document.getElementById("summary").innerHTML = "<tr><th>名前</th><th>現在</th><th>7日比</th><th>最高</th></tr>" + rows.join("");
}
document.getElementById("ranges").innerHTML = RANGES.map(([l,d]) => `<button data-d="${d}" class="${d===days?"on":""}">${l}</button>`).join("");
document.getElementById("ranges").onclick = e => {
  if (!e.target.dataset.d) return;
  days = +e.target.dataset.d;
  document.querySelectorAll("#ranges button").forEach(b => b.classList.toggle("on", b===e.target));
  render();
};
fetch("mr.json", {cache:"no-store"}).then(r => r.json()).then(j => {
  data = j;
  document.getElementById("updated").textContent = "最終更新 " + new Date(j.updated).toLocaleString("ja-JP");
  render(); summary();
}).catch(() => document.getElementById("updated").textContent = "mr.json を読み込めませんでした");
</script>
</body>
</html>
